name: Descompactar imagens
on:
  workflow_dispatch:
  push:
    paths: ['img.zip']
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Descompactar
        run: unzip -o img.zip
      - name: Salvar pasta img
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add img
          if ! git diff --cached --quiet; then
            git commit -m "Descompacta img.zip"
            git push
          fi
