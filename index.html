<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Shadow Clan RPG</title>
<meta name="theme-color" content="#0c0b0d">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<script>
  tailwind.config = { theme: { extend: {
    colors: { sumi:'#0c0b0d', lacq:'#17141a', line:'#2b252b', vermil:'#c8321f', gold:'#d9a93f', paper:'#ece6da', chakra:'#5aa7c7' },
    fontFamily: { jp: ['"Shippori Mincho"', 'Georgia', 'serif'] } } } };
</script>
<style>
  body{background:radial-gradient(ellipse at 50% -10%,#2a1216 0,#0c0b0d 55%) fixed;color:#ece6da;-webkit-tap-highlight-color:transparent}
  .card{background:linear-gradient(160deg,#1b171d,#141116);border:1px solid #2b252b;border-radius:1rem;box-shadow:0 10px 28px rgba(0,0,0,.45);padding:1rem}
  .bar{height:.4rem;border-radius:9999px;background:#2b252b;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:9999px;transition:width .5s}
  .seal{background:#c8321f;border:2px solid #d9a93f;border-radius:.6rem;transform:rotate(-4deg);box-shadow:0 0 0 3px #0c0b0d,0 6px 16px rgba(200,50,31,.35);font-family:"Shippori Mincho",Georgia,serif;font-weight:800;display:grid;place-items:center}
  .btn{border-radius:.75rem;padding:.7rem 1rem;font-weight:700;background:#c8321f;color:#fff;transition:transform .1s,opacity .2s}
  .btn:active,.round:active{transform:scale(.95)}
  .btn:disabled{opacity:.35}
  .btn-gold{background:#d9a93f;color:#1a1208}
  .btn-ghost{background:transparent;border:1px solid #d9a93f;color:#d9a93f}
  .round{width:2.25rem;height:2.25rem;border-radius:9999px;border:1px solid #d9a93f;color:#d9a93f;font-size:1.25rem;line-height:1}
  .chip{border:1px solid #2b252b;border-radius:9999px;padding:.2rem .8rem;font-size:.8rem}
  .chip.on{border-color:#d9a93f;color:#d9a93f;background:#d9a93f1a}
  .tag{display:inline-block;border-radius:9999px;padding:.1rem .6rem;font-size:.7rem;border:1px solid #2b252b;color:#ece6dacc}
  .tag.gold{border-color:#d9a93f;color:#d9a93f}.tag.red{border-color:#c8321f;color:#e8684f}
  .inp{width:100%;background:#0c0b0d;border:1px solid #2b252b;border-radius:.7rem;padding:.65rem .8rem;color:#ece6da}
  .inp:focus,.btn:focus-visible,.chip:focus-visible,.round:focus-visible,nav button:focus-visible{outline:2px solid #d9a93f;outline-offset:2px}
  .lbl{font-size:.75rem;color:#ece6da99}
  .slot{border:1px dashed #3a323a;border-radius:.75rem;padding:.6rem;min-width:0}
  h2{font-family:"Shippori Mincho",Georgia,serif;font-weight:800;font-size:1.05rem}
  nav button{display:flex;flex-direction:column;align-items:center;gap:.15rem;padding:.55rem 0;font-size:.62rem;color:#ece6da80;border-top:2px solid transparent}
  nav button.on{color:#d9a93f;border-top-color:#d9a93f}
  nav svg{width:1.4rem;height:1.4rem;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
  /* ───── Polimento visual: atmosfera, profundidade, brilho nas barras e transições ───── */
  body{background:radial-gradient(ellipse 85% 45% at 50% -6%,#3b1519 0,transparent 62%),radial-gradient(circle at 90% 7%,rgba(217,169,63,.17) 0,rgba(217,169,63,0) 17%),radial-gradient(ellipse at 50% 120%,#1a0d12 0,transparent 55%),#0c0b0d fixed;font-feature-settings:"tnum"}
  header{background:linear-gradient(180deg,rgba(14,12,15,.97),rgba(12,11,13,.86))!important;box-shadow:0 8px 24px rgba(0,0,0,.45)}
  #hAv{font-size:1.65rem}
  .card{background:linear-gradient(165deg,#1e191f 0%,#141116 72%);border:1px solid #2f282f;box-shadow:0 12px 30px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.045)}
  h2::before{content:"";display:inline-block;width:.2rem;height:.95em;margin-right:.55rem;vertical-align:-.12em;border-radius:2px;background:linear-gradient(#e8684f,#a82a1a)}
  .bar{height:.5rem;background:#231e24;box-shadow:inset 0 1px 3px rgba(0,0,0,.65)}
  .bar>i{transition:width .6s cubic-bezier(.2,.8,.2,1)}
  .bar>i.bg-vermil,.bar>i.to-vermil{background:linear-gradient(90deg,#8e1d12,#e0452c);box-shadow:0 0 9px rgba(224,69,44,.5)}
  .bar>i.bg-chakra{background:linear-gradient(90deg,#2d6f8c,#7cc7e6);box-shadow:0 0 9px rgba(90,167,199,.45)}
  .bar>i.bg-gold{background:linear-gradient(90deg,#9d7119,#f0c860);box-shadow:0 0 9px rgba(217,169,63,.4)}
  .btn{background:linear-gradient(180deg,#d83f29,#aa2817);box-shadow:0 6px 16px rgba(200,50,31,.28),inset 0 1px 0 rgba(255,255,255,.2);letter-spacing:.01em}
  .btn.btn-gold{background:linear-gradient(180deg,#eac15a,#c4922a);box-shadow:0 6px 16px rgba(217,169,63,.24),inset 0 1px 0 rgba(255,255,255,.32)}
  .btn.btn-ghost{background:rgba(217,169,63,.06);box-shadow:none}
  .btn:disabled{box-shadow:none;filter:grayscale(.45)}
  .chip{background:#17141a;transition:border-color .15s,background .15s,transform .1s}
  .chip:active{transform:scale(.94)}.chip:disabled{opacity:.35}
  .chip.on{box-shadow:0 0 12px rgba(217,169,63,.2)}
  .tag{background:rgba(255,255,255,.04)}
  .tag.gold{background:rgba(217,169,63,.1)}.tag.red{background:rgba(200,50,31,.12)}
  .inp:focus{border-color:#d9a93f;box-shadow:0 0 0 3px rgba(217,169,63,.15)}
  .border-vermil{border-color:#c8321f!important;box-shadow:0 0 0 1px rgba(200,50,31,.35),0 0 28px rgba(200,50,31,.22),0 12px 30px rgba(0,0,0,.5)}
  .border-gold{border-color:#d9a93f!important;box-shadow:0 0 22px rgba(217,169,63,.16),0 12px 30px rgba(0,0,0,.5)}
  details>summary{list-style:none;cursor:pointer}details>summary::-webkit-details-marker{display:none}
  details>summary::before{content:"▸";display:inline-block;width:1rem;color:#d9a93f}details[open]>summary::before{content:"▾"}
  nav{background:linear-gradient(180deg,rgba(20,16,21,.94),rgba(9,8,10,.99))!important;box-shadow:0 -8px 24px rgba(0,0,0,.45)}
  nav button{position:relative;transition:color .2s}
  nav button.on{color:#f0c860;border-top-color:transparent}
  nav button.on::before{content:"";position:absolute;top:0;left:20%;right:20%;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#d9a93f,transparent);box-shadow:0 0 12px #d9a93f}
  nav button svg{transition:transform .2s,filter .2s}
  nav button.on svg{transform:translateY(-1px) scale(1.1);filter:drop-shadow(0 0 6px rgba(217,169,63,.55))}
  .tab:not(.hidden){animation:tabin .28s ease both}
  @keyframes tabin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .foe{animation:foe 2.4s ease-in-out infinite}
  @keyframes foe{0%,100%{box-shadow:0 0 0 3px #0c0b0d,0 6px 16px rgba(200,50,31,.35)}50%{box-shadow:0 0 0 3px #0c0b0d,0 6px 26px rgba(200,50,31,.7)}}
  .log-me{color:#e8c870}.log-crit{font-weight:700;color:#f0c860}
  ::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#2f282f;border-radius:6px}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .tile{position:relative;overflow:hidden;border-radius:1rem;min-height:7.4rem;padding:.8rem;border:1px solid #2f282f;display:flex;flex-direction:column;justify-content:flex-end;text-align:left;background:linear-gradient(160deg,var(--a,#3a1519),var(--b,#120f13));box-shadow:0 10px 24px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.05);transition:transform .12s}
  .mini{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.2rem;min-height:4.6rem;padding:.4rem .2rem;border-radius:.8rem;border:1px solid #2f282f;background:linear-gradient(160deg,#241a1d,#120f13);text-align:center}
  .mini:active{transform:scale(.95)}.mini img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
  .mini>*{position:relative}.mini .ico{font-size:1.5rem;line-height:1}.mini b{font-size:.62rem;line-height:1.1;font-weight:700}
  .mini .soon{position:absolute;top:.15rem;right:.25rem;font-size:.5rem;font-style:normal;color:#d9a93f}
  .tile:active{transform:scale(.97)}
  .tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .tile::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 30%,rgba(0,0,0,.8))}
  .tile>*{position:relative;z-index:1}.tile .ico{position:absolute;top:.45rem;right:.7rem;z-index:0;font-size:2.7rem;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
</style>
</head>
<body class="min-h-screen font-sans">

<!-- Cabeçalho fixo: identidade, vida, chakra e XP (única fonte do status do personagem) -->
<header class="sticky top-0 z-20 px-4 pb-3 bg-sumi/90 backdrop-blur border-b border-line" style="padding-top:calc(env(safe-area-inset-top,0px) + .75rem)">
  <div class="flex items-center gap-3">
    <div class="seal w-11 h-11 text-2xl" id="hAv">🥷</div>
    <div class="flex-1 min-w-0">
      <div class="flex items-center gap-2"><h1 id="hName" class="font-jp font-extrabold text-lg truncate">Carregando</h1><span id="hRank" class="tag gold"></span></div>
      <div class="lbl" id="hSub"></div>
    </div>
    <div class="text-right"><div class="font-bold text-gold" id="hRyos">0</div><div class="lbl">ryos</div></div>
  </div>
  <div class="grid grid-cols-3 gap-2.5 mt-3 text-xs">
    <div><div class="flex justify-between mb-1"><span>Vida</span><span id="tHp"></span></div><div class="bar"><i id="bHp" class="bg-vermil"></i></div></div>
    <div><div class="flex justify-between mb-1"><span>Chakra</span><span id="tCk"></span></div><div class="bar"><i id="bCk" class="bg-chakra"></i></div></div>
    <div><div class="flex justify-between mb-1"><span>Energia</span><span id="tEn"></span></div><div class="bar"><i id="bEn" class="bg-gold"></i></div></div>
  </div>
  <div class="bar mt-2" style="height:.2rem"><i id="bXp" class="bg-gold"></i></div>
</header>

<main class="px-4 pt-4 space-y-3" style="padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6rem)">
  <button id="backBtn" class="hidden chip mb-1" onclick="goBack()">← Voltar</button>
  <section id="tab-menu" class="tab space-y-3 hidden"></section>
  <section id="tab-atributos" class="tab space-y-3 hidden"></section>
  <section id="tab-status" class="tab space-y-3 hidden"></section>
  <section id="tab-opcoes" class="tab space-y-3 hidden"></section>
  <section id="tab-bolsa" class="tab space-y-3 hidden"></section>
  <section id="tab-treino" class="tab space-y-3 hidden"></section>
  <section id="tab-hospital" class="tab space-y-3 hidden"></section>
  <section id="tab-forja" class="tab space-y-3 hidden"></section>
  <section id="tab-masmorras" class="tab space-y-3 hidden"></section>
  <section id="tab-torre" class="tab space-y-3 hidden"></section>
  <section id="tab-arena" class="tab space-y-3 hidden"></section>
  <section id="tab-prog" class="tab space-y-3 hidden"></section>
  <section id="tab-jutsus" class="tab space-y-3 hidden"></section>
  <section id="tab-perfil" class="tab space-y-3"></section>
  <section id="tab-jornada" class="tab space-y-3 hidden"></section>
  <section id="tab-mapas" class="tab space-y-3 hidden"></section>
  <section id="tab-vila" class="tab space-y-3 hidden"></section>
  <section id="tab-guilda" class="tab space-y-3 hidden"></section>
  <section id="tab-loja" class="tab space-y-3 hidden"></section>
  <section id="tab-ranking" class="tab space-y-3 hidden"></section>
</main>

<nav class="fixed bottom-0 inset-x-0 z-30 grid grid-cols-6 bg-sumi/95 backdrop-blur border-t border-line" style="padding-bottom:env(safe-area-inset-bottom,0px)">
  <button data-tab="perfil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg> Perfil</button>
  <button data-tab="mapas"><svg viewBox="0 0 24 24"><path d="M3 6h18M5 9.5h14M7 6v14M17 6v14M4 4c4 1 12 1 16 0"/></svg> Portão</button>
  <button data-tab="jornada"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14l-3-2-2 2-2-2-2 2-3-2V5a2 2 0 0 1 2-2z"/><path d="M9 8h6M9 12h6"/></svg> Quests</button>
  <button data-tab="hospital"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/><path d="M12 8v8M8 12h8"/></svg> Hospital</button>
  <button data-tab="loja"><svg viewBox="0 0 24 24"><path d="M4 9h16l-1.5 11h-13z"/><path d="M8 9V7a4 4 0 0 1 8 0v2"/></svg> Loja</button>
  <button data-tab="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg> Menu</button>
</nav>

<div id="regBox" class="hidden fixed inset-0 z-40 bg-sumi overflow-y-auto p-5">
  <div class="max-w-md mx-auto space-y-4 pt-6">
    <h2 style="font-size:1.6rem">Crie seu ninja</h2>
    <p class="text-sm text-paper/60">Escolha o nome e a vila e distribua 5 pontos de atributo. Você começa como Estudante, sem clã, com 500 ryos.</p>
    <input id="rName" class="inp" maxlength="32" placeholder="Nome ninja (3 a 32 letras)">
    <div id="rPts" class="space-y-3"></div>
    <div id="rQuiz" class="space-y-3"></div>
    <select id="rVillage" class="inp"></select>
    <p id="rDesc" class="text-xs text-paper/60 min-h-[2rem]"></p>
    <p id="rInfo" class="text-xs text-gold min-h-[1rem]"></p>
    <button class="btn btn-gold w-full" onclick="register()">Criar personagem</button>
  </div>
</div>
<div id="fatalBox" class="hidden fixed inset-0 z-50 bg-sumi grid place-items-center p-6 text-center">
  <div class="space-y-4"><p id="fatalMsg"></p><button class="btn" onclick="location.reload()">Tentar de novo</button></div>
</div>
<div id="avBox" class="hidden fixed inset-0 z-40 bg-black/70 grid place-items-center p-5" onclick="if (event.target === this) closeAvatar()">
  <div class="card w-full max-w-sm"><div class="flex justify-between items-center"><h2>Escolha seu avatar</h2><button class="chip" onclick="closeAvatar()">Fechar</button></div>
    <div id="avGrid" class="grid grid-cols-6 gap-2 mt-3"></div></div>
</div>

<div id="lutaBox" class="hidden fixed inset-0 overflow-y-auto p-4" style="z-index:36;background:#0c0b0d;padding-top:calc(env(safe-area-inset-top,0px) + 1rem);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 1rem)"></div>

<div id="toast" class="hidden fixed left-4 right-4 z-50 rounded-xl px-4 py-3 text-sm font-semibold shadow-xl"></div>

<script>
/* ───────── Configuração ───────── */
const API_BASE = 'https://shadow-clan-rpg.onrender.com'; // URL HTTPS do backend

const tg = window.Telegram?.WebApp;
tg?.ready(); tg?.expand();
tg?.disableVerticalSwipes?.(); tg?.enableClosingConfirmation?.();
tg?.setHeaderColor?.('#0c0b0d'); tg?.setBackgroundColor?.('#0c0b0d');
// Fora do Telegram, use ?tid=123 para testar no navegador
const tgUser = tg?.initDataUnsafe?.user || { id: Number(new URLSearchParams(location.search).get('tid')) || 0, username: 'dev' };

/* ───────── Utilitários ───────── */
const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString('pt-BR');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pct = (a, b) => Math.max(0, Math.min(100, a / (b || 1) * 100)) + '%';
const expFloor = l => 50 * l * (l - 1);
const RANKS = ['Estudante', 'Genin', 'Chunin', 'Jonin', 'Anbu', 'Sannin', 'Kage'];
const ATTRS = [['taijutsu', 'Taijutsu', 'golpes físicos'], ['ninjutsu', 'Ninjutsu', 'técnicas de chakra'], ['genjutsu', 'Genjutsu', 'ilusões que atordoam'],
  ['forca', 'Força', 'dano físico'], ['agilidade', 'Agilidade', 'iniciativa e esquiva'], ['inteligencia', 'Inteligência', 'controle de chakra e missões secretas'],
  ['chakra_attr', 'Chakra', 'reserva de chakra'], ['defesa', 'Defesa', 'reduz o dano'], ['vigor', 'Vigor', 'vida máxima'], ['destreza', 'Destreza', 'armas e crítico']];
const ELEM = { fogo: ['Fogo', '🔥'], agua: ['Água', '💧'], raio: ['Raio', '⚡'], terra: ['Terra', '🪨'], vento: ['Vento', '🌪️'] };
const REG = ATTRS.slice(3);  // os 7 atributos de combate que recebem os 5 pontos do cadastro
const TIPOS = { Arma: 'Armas', Armadura: 'Armaduras', Pergaminho: 'Pergaminhos', Botas: 'Botas', Luvas: 'Luvas', Colar: 'Colares', Anel: 'Anéis' };
const bonusTxt = b => Object.entries(b).filter(([k]) => k[0] !== '_').map(([k, v]) => `+${v} ${k}`).join(', ') + (b._ref ? ` (refino +${b._ref})` : '');
const dur = s => s >= 60 ? Math.round(s / 60) + ' min' : s + ' s';
let P, X, J, G, K, R, LU, CL, LJ, PT, BO, ljSec = 'itens', boSec = 'equipados', VILS, battle = null, reps = 1;
let FJ, DO, MS, TR, AR, fjSec = 'refinar', doAttr = 'taijutsu', dsess = 1;

function toast(msg, ok = true, ms = 3000) {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'fixed left-4 right-4 z-50 rounded-xl px-4 py-3 text-sm font-semibold shadow-xl ' + (ok ? 'bg-gold text-sumi' : 'bg-vermil text-white');
  t.style.top = 'calc(env(safe-area-inset-top,0px) + .75rem)';
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), ms);
  tg?.HapticFeedback?.notificationOccurred?.(ok ? 'success' : 'error');
}
function fatal(msg) { $('fatalMsg').textContent = msg; $('fatalBox').classList.remove('hidden'); }

async function api(path, body) {
  const opt = { headers: { 'X-Telegram-Init-Data': tg?.initData || '' } };
  if (body) { opt.method = 'POST'; opt.headers['Content-Type'] = 'application/json'; opt.body = JSON.stringify(body); }
  let r;
  try { r = await fetch(API_BASE + path, opt); } catch { throw new Error('Sem conexão com o servidor.'); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) {
    const det = d.detail, e = new Error((Array.isArray(det) ? det.map(x => x.msg).join('; ') : det) || `Erro ${r.status}`);
    e.message = e.message.replace('Value error, ', ''); e.status = r.status; throw e;
  }
  return d;
}
async function refresh() {
  const id = tgUser.id;
  [P, X, J, G, K, { luta: LU }, CL, BO] = await Promise.all([api('/api/player/' + id), api(`/api/player/${id}/extras`), api(`/api/player/${id}/jornada`),
    api(`/api/player/${id}/guilda`), api(`/api/player/${id}/kage`), api(`/api/player/${id}/luta`), api(`/api/player/${id}/clan`), api(`/api/player/${id}/bolsa`)]);
  render();
}
// Ação: chama a API, mostra um aviso e recarrega o estado
async function act(path, body, msg) {
  try {
    const r = await api(path, { telegram_id: tgUser.id, ...body });
    if (msg) toast(msg(r), r.entrou !== false && r.vitoria !== false);
    await refresh();
    return r;
  } catch (e) { toast(e.message, false); }
}

/* ───────── Abas ───────── */
const MAIN = ['perfil', 'mapas', 'jornada', 'hospital', 'loja', 'menu'];
// Subtelas acendem o ícone da aba de onde se chega nelas
const PAI = { atributos: 'perfil', status: 'perfil', opcoes: 'perfil', jutsus: 'perfil', bolsa: 'perfil', guilda: 'perfil' };
let cur = 'perfil', navStack = [];
const goBack = () => showTab(navStack.pop() || 'menu', true);
function showTab(name, back) {
  if (MAIN.includes(name)) navStack = []; else if (!back && name !== cur) navStack.push(cur);
  cur = name;
  $('backBtn').classList.toggle('hidden', MAIN.includes(name));
  if (name === 'ranking') loadRanking();
  if (name === 'loja') loadLoja();
  if (name === 'forja') loadForja();
  if (name === 'treino') loadDojo();
  if (name === 'masmorras') loadMasm();
  if (name === 'torre') loadTorre();
  if (name === 'arena') loadArena();
  if (name === 'prog') loadProg();
  document.querySelectorAll('.tab').forEach(s => s.classList.toggle('hidden', s.id !== 'tab-' + name));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === (MAIN.includes(name) ? name : PAI[name] || 'menu')));
  tg?.HapticFeedback?.selectionChanged?.();
}
document.querySelectorAll('nav button').forEach(b => b.onclick = () => showTab(b.dataset.tab));

/* ───────── Renderização ───────── */
function renderHeader() {
  $('hName').textContent = P.ninja_name; $('hRank').textContent = `${P.rank_titulo || P.rank} ${(ELEM[P.elemento] || [])[1] || ''}`; $('hAv').textContent = P.avatar;
  $('hSub').textContent = `Nível ${P.level}, fama ${fmt(P.fama)}, ${P.village.name}`;
  $('hRyos').textContent = fmt(P.ryos);
  $('tHp').textContent = `${P.vida.atual}/${P.vida.max}`; $('tCk').textContent = `${P.chakra.atual}/${P.chakra.max}`;

async function dropAcao(id, tipo) {

const ptsLeft = () => 5 - Object.values(pts).reduce((x, y) => x + y, 0);
function renderPts() {
  $('rPts').innerHTML = `<p class="text-sm">Estilo principal (+3)</p><div class="flex gap-2">${ATTRS.slice(0, 3).map(([k, n]) =>
    `<button class="chip ${k === estilo ? 'on' : ''}" onclick="estilo='${k}'; renderPts()">${n}</button>`).join('')}</div>
    <p class="text-sm">Distribua <b class="text-gold">${ptsLeft()}</b> pontos (todos começam em 5)</p>` + REG.map(([k, n, ds]) =>
    `<div class="flex items-center justify-between"><div><div>${n}</div><div class="lbl">${ds}</div></div><div class="flex items-center gap-3"><button class="round" aria-label="Menos ${n}" onclick="addPt('${k}', -1)">−</button>
     <b class="w-6 text-center">${5 + pts[k]}</b><button class="round" aria-label="Mais ${n}" onclick="addPt('${k}', 1)">+</button></div></div>`).join('');
}
function addPt(k, d) { if ((d > 0 && !ptsLeft()) || (d < 0 && !pts[k])) return; pts[k] += d; renderPts(); }

let QZ = [], ans = [];
function renderQuiz() {
  $('rQuiz').innerHTML = `<p class="text-sm">Teste do elemento: responda com sinceridade</p>` + QZ.map((q, i) => `<div><p class="text-sm font-semibold">${i + 1}. ${esc(q.p)}</p>
    <div class="grid gap-1.5 mt-1.5">${q.o.map((t, j) => `<button class="chip !justify-start text-left ${ans[i] === j ? 'on' : ''}" onclick="ans[${i}] = ${j}; renderQuiz()">${esc(t)}</button>`).join('')}</div></div>`).join('');
}
async function showRegister() {
  renderPts();
  try {
    const o = await api('/api/setup/options');
    VILS = o.villages; QZ = o.teste; ans = QZ.map(() => -1); renderQuiz();
    $('rVillage').innerHTML = VILS.map(v => `<option value="${v.id}">${esc(v.name)}</option>`).join('');
    const desc = () => { $('rDesc').textContent = (VILS.find(v => v.id === Number($('rVillage').value)) || {}).description || ''; };
    $('rVillage').onchange = desc; desc();
    $('regBox').classList.remove('hidden');
  } catch (e) { fatal(e.message); }
}
async function register() {
  if (ptsLeft()) return ($('rInfo').textContent = 'Distribua todos os 5 pontos.');
  if (ans.some(a => a < 0)) return ($('rInfo').textContent = 'Responda todas as perguntas do teste do elemento.');
  $('rInfo').textContent = '';
  try {
    await api('/api/register', { telegram_id: tgUser.id, username: tgUser.username || null, ninja_name: $('rName').value.trim(),
      village_id: Number($('rVillage').value), estilo, ...pts, respostas: ans });
    $('regBox').classList.add('hidden');
    await refresh();
    toast(`Bem-vindo, ${P.ninja_name}! Seu elemento: ${ELEM[P.elemento][0]}.`);
  } catch (e) { $('rInfo').textContent = e.message; }
}
// Vida e chakra regeneram com o tempo: atualiza só o cabeçalho, sem refazer as telas (preserva o que está sendo digitado)
setInterval(async () => {
  if (!P || document.hidden) return;
  try { P = await api('/api/player/' + tgUser.id); renderHeader(); } catch {}
}, 30000);

/* Progresso: missões diárias e semanais, conquistas, login diário, eventos e passe de temporada */
let PG, PGP = 0, pgSec = 'missoes';
const PG_SEC = [['missoes', '📜 Missões'], ['conq', '🏅 Conquistas'], ['login', '📅 Login'], ['passe', '🎫 Passe']];
const abrirProg = sec => { pgSec = sec; showTab('prog'); renderProg(); };
async function loadProg() {
  try { PG = await api(`/api/player/${tgUser.id}/progresso`); PGP = PG.pendentes; renderProg(); renderMenu(); } catch (e) { toast(e.message, false); }
}
async function pgPend() {
  try {
    PGP = (await api(`/api/player/${tgUser.id}/progresso`)).pendentes; renderMenu();
    if (PGP) toast(`Você tem ${PGP} recompensa${PGP > 1 ? 's' : ''} para coletar: Menu → Missões.`, true, 5000);
  } catch {}
}
async function progColetar(path, body = {}) {
  try { toast((await api(path, { telegram_id: tgUser.id, ...body })).mensagem, true, 4500); await refresh(); loadProg(); } catch (e) { toast(e.message, false); }
}
const rwTxt = r => [r.ryos && `${fmt(r.ryos)} ryos`, r.exp && `${fmt(r.exp)} XP`, r.arena && `${r.arena} moedas da Arena`, r.pocao && `${r.pocao[1]}x ${r.pocao[0]}`,
  r.mat && `${r.mat[1]}x ${r.mat[0]}`, r.ovo, r.passe && `${r.passe} XP do passe`].filter(Boolean).map(esc).join(', ');
const pgBtn = (pronta, feita, rota, corpo) => feita ? '<span class="tag">✓ coletado</span>'
  : `<button class="btn ${pronta ? 'btn-gold' : ''}" ${pronta ? '' : 'disabled'} onclick='progColetar("${rota}", ${corpo})'>Coletar</button>`;
function renderProg() {
  if (!PG) return;
  const nav = `<div class="flex gap-1.5 flex-wrap">${PG_SEC.map(([k, n]) => `<button class="chip ${k === pgSec ? 'on' : ''}" onclick="pgSec='${k}'; renderProg()">${n}</button>`).join('')}</div>`;
  $('tab-prog').innerHTML = nav + ({ missoes: pgMissoes, conq: pgConq, login: pgLogin, passe: pgPasse }[pgSec])();
}
function pgMissoes() {
  const ev = PG.evento, m = PG.missoes;
  const lin = (x, rota) => `<div class="py-2 border-t border-line"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm font-semibold">${esc(x.texto)}</div>
    <div class="lbl">${x.prog}/${x.qtd}. Prêmio: ${rwTxt(x.premio)}</div></div>${pgBtn(x.pronta, x.coletada, rota, JSON.stringify({ id: x.id }))}</div>
    <div class="bar mt-1"><i class="bg-gold" style="width:${pct(x.prog, x.qtd)}"></i></div></div>`;
  const bonus = (b, id, txt) => `<div class="py-2 border-t border-line flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm font-semibold">${txt}</div>
    <div class="lbl">Prêmio: ${rwTxt(b.premio)}</div></div>${pgBtn(b.pronto, b.coletado, '/api/prog/missao/coletar', JSON.stringify({ id }))}</div>`;
  return `<div class="card border-gold"><div class="flex items-center justify-between"><h2>${esc(ev.nome)}</h2><span class="tag gold">${ev.dias} dia${ev.dias === 1 ? '' : 's'}</span></div>
    <p class="text-sm mt-1">${esc(ev.desc)}</p><div class="py-2 mt-2 border-t border-line"><div class="flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm font-semibold">${esc(ev.meta_texto)}</div>
    <div class="lbl">${ev.prog}/${ev.qtd}. Prêmio: ${rwTxt(ev.premio)}</div></div>${pgBtn(ev.pronta, ev.coletada, '/api/prog/evento/coletar', '{}')}</div>
    <div class="bar mt-1"><i class="bg-gold" style="width:${pct(ev.prog, ev.qtd)}"></i></div></div></div>
    <div class="card"><h2>Missões diárias</h2><p class="lbl mt-1">Renovam à meia-noite UTC (21h em Brasília).</p>${m.diarias.map(x => lin(x, '/api/prog/missao/coletar')).join('')}
    ${bonus(m.bonus_dia, 'd_tudo', 'Bônus: colete as 3 do dia')}</div>
    <div class="card"><div class="flex items-center justify-between"><h2>Missões semanais</h2><span class="tag">${PG.dias_semana} dia${PG.dias_semana === 1 ? '' : 's'}</span></div>
    ${m.semanais.map(x => lin(x, '/api/prog/missao/coletar')).join('')}${bonus(m.bonus_semana, 's_tudo', 'Bônus: colete as 3 da semana')}</div>`;
}
function pgConq() {
  return PG.conquistas.map(c => {
    const pend = c.degraus.filter(d => d.ok && !d.coletada).length, feitas = c.degraus.filter(d => d.coletada).length;
    return `<div class="card"><div class="flex items-center justify-between"><h2>${esc(c.nome)}</h2><span class="tag ${pend ? 'gold' : ''}">${feitas}/${c.degraus.length}${pend ? ` · ${pend} a coletar` : ''}</span></div>
      ${c.degraus.map(d => `<div class="py-2 border-t border-line flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm ${d.coletada ? 'text-paper/50' : 'font-semibold'}">${esc(d.texto)}</div>
      <div class="lbl">${d.coletada ? 'Concluída' : `${fmt(Math.min(c.valor, d.meta))}/${fmt(d.meta)}. Prêmio: ${rwTxt(d.premio)}`}</div></div>
      ${d.coletada ? '<span class="tag">✓</span>' : pgBtn(d.ok, false, '/api/prog/conquista/coletar', JSON.stringify({ id: d.id }))}</div>`).join('')}</div>`;
  }).join('');
}
function pgLogin() {
  const L = PG.login;
  const dias = L.ciclo.map((r, i) => {
    const n = i + 1, feito = !L.pode ? n <= L.dia_ciclo : n < L.dia_ciclo, hoje = L.pode && n === L.dia_ciclo;
    return `<div class="rounded-xl p-2 text-center border ${hoje ? 'border-gold' : 'border-line'} ${feito ? 'opacity-50' : ''}"><div class="lbl">Dia ${n}</div><div class="text-xs mt-1">${feito ? '✓' : rwTxt(r)}</div></div>`;
  }).join('');
  return `<div class="card"><div class="flex items-center justify-between"><h2>Login diário</h2><span class="tag gold">${L.seq} seguido${L.seq === 1 ? '' : 's'}</span></div>
    <p class="lbl mt-1">Entre todo dia para manter a sequência. Faltar um dia reinicia no dia 1. Melhor sequência: ${L.melhor}.</p>
    <div class="grid grid-cols-2 gap-2 mt-3">${dias}</div>
    <button class="btn ${L.pode ? 'btn-gold' : ''} w-full mt-3" ${L.pode ? '' : 'disabled'} onclick="progColetar('/api/prog/login/coletar')">${L.pode ? '🎁 Coletar recompensa de hoje' : 'Volte amanhã'}</button></div>`;
}
function pgPasse() {
  const S = PG.passe, rest = S.xp - S.nivel * S.xp_nivel;
  const niv = S.niveis.map(n => `<div class="py-2 border-t border-line flex items-center justify-between gap-2"><div class="min-w-0"><div class="text-sm ${n.ok ? 'font-semibold' : 'text-paper/60'}">Nível ${n.n}</div>
    <div class="lbl">${rwTxt(n.premio)}</div></div>${n.coletado ? '<span class="tag">✓</span>' : pgBtn(n.ok, false, '/api/prog/passe/coletar', JSON.stringify({ nivel: n.n }))}</div>`).join('');
  return `<div class="card"><div class="flex items-center justify-between"><h2>Passe da temporada ${S.temporada}</h2><span class="tag gold">${S.dias} dia${S.dias === 1 ? '' : 's'}</span></div>
    <p class="lbl mt-1">Ganhe XP do passe lutando, treinando, forjando e cumprindo missões. Cada nível libera um prêmio. O passe zera a cada 28 dias, então colete antes de acabar.</p>
    <div class="flex items-center justify-between mt-3 text-sm"><b>Nível ${S.nivel}/${S.max}</b><span class="lbl">${S.nivel >= S.max ? 'máximo' : `${rest}/${S.xp_nivel} XP`}</span></div>
    <div class="bar mt-1"><i class="bg-gold" style="width:${S.nivel >= S.max ? '100%' : pct(rest, S.xp_nivel)}"></i></div></div><div class="card">${niv}</div>`;
}

(async function init() {
  showTab('perfil');
  if (!tgUser.id) return fatal('Abra este app pelo Telegram. Para testar no navegador, use ?tid=123 no endereço.');
  try { await refresh(); pgPend(); } catch (e) { e.status === 404 ? showRegister() : fatal(e.message); }
})();
</script>
</body>
</html>
