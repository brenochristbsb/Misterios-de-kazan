<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistérios de Kazan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0a1f; --card: #1a1333; --card2: #241a45; --text: #efe9ff;
    --muted: #a99fcb; --gold: #f4c95d; --accent: #8b5cf6; --ok: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #3b2a7a 0%, transparent 60%), var(--bg);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { text-align: center; padding: 8px 0 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; color: var(--gold); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border: 1px solid #2f2459; border-radius: 12px; padding: 10px 4px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bar { height: 6px; background: #2a2150; border-radius: 99px; overflow: hidden; margin: -6px 0 16px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .5s; }

  .card { background: var(--card); border: 1px solid #2f2459; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); line-height: 1.5; }
  .opcao { cursor: pointer; transition: transform .1s, border-color .2s; }
  .opcao:active { transform: scale(.98); border-color: var(--accent); }
  .tag { display: inline-block; margin-top: 10px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); }
  .tag.done { color: var(--ok); }
  .perfil p { font-size: 14px; margin-top: 2px; }
  .perfil b { color: var(--text); }
  .titulo-secao { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .8px; margin: 18px 4px 8px; }

  .capitulo .titulo { font-size: 22px; margin: 0 0 12px; color: var(--gold); }
  .capitulo .texto { font-size: 17px; line-height: 1.7; margin: 0; color: var(--text); }
  .reward { margin-top: 14px; font-size: 14px; color: var(--ok); }
  .locked { color: var(--bad); }

  button { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6d3df0); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  button.sec { background: var(--card2); color: var(--muted); font-weight: 500; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; max-width: 90%; text-align: center;
    background: var(--card2); border: 1px solid var(--gold); color: var(--gold); padding: 10px 18px; border-radius: 16px; font-size: 14px;
    transition: all .3s; pointer-events: none; z-index: 10; white-space: pre-line; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌙 Mistérios de Kazan</h1>
    <p>A Grande Academia o aguarda</p>
  </header>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><b id="nivel">1</b><span>Nível</span></div>
    <div class="stat"><b id="exp">0</b><span>EXP</span></div>
    <div class="stat"><b id="moedas">0</b><span>Moedas</span></div>
    <div class="stat"><b id="eter">0</b><span>Éter</span></div>
  </div>
  <div class="bar" id="barraBox" style="display:none"><i id="barra"></i></div>

  <main id="tela"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0f0a1f"); tg.setBackgroundColor("#0f0a1f"); } catch (e) {} }

  var jogador = null, progresso = {}, aldeias = [], tradicoes = [], sagas = [];
  var aldeiaEscolhida = null;

  function $(id) { return document.getElementById(id); }
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
  function nomeDe(lista, id) { for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].nome; return "—"; }

  function toast(msg, ms) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, ms || 2400);
  }
  function haptic(tipo) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(tipo || "success"); } catch (e) {} }

  function api(url, opcoes) {
    opcoes = opcoes || {};
    opcoes.headers = Object.assign({ "X-Telegram-Init-Data": (tg && tg.initData) || "" }, opcoes.headers || {});
    if (opcoes.body && typeof opcoes.body !== "string") {
      opcoes.body = JSON.stringify(opcoes.body);
      opcoes.headers["Content-Type"] = "application/json";
    }
    return fetch(url, opcoes).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.erro || ("Erro " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function hud() {
    if (!jogador) return;
    $("stats").style.display = "flex"; $("barraBox").style.display = "block";
    $("nivel").textContent = jogador.nivel;
    $("exp").textContent = jogador.exp;
    $("moedas").textContent = jogador.moedas;
    $("eter").textContent = jogador.moedas_eter;
    $("barra").style.width = (jogador.exp % 100) + "%";
  }

  function telaErro(msg, retry) {
    $("tela").innerHTML = '<div class="card fade"><h2>⚠️ Ops</h2><p>' + esc(msg) + '</p>' +
      (retry ? '<button id="tentar">Tentar de novo</button>' : '') + '</div>';
    if (retry) $("tentar").onclick = retry;
  }

  // ---------- Início ----------
  function iniciar() {
    if (!tg || !tg.initData) {
      return telaErro("Abra o jogo pelo botão “Jogar Kazan” dentro do Telegram.");
    }
    $("tela").innerHTML = '<div class="card"><p>Carregando…</p></div>';
    Promise.all([api("/api/dados"), api("/api/sagas"), api("/api/jogador")]).then(function (r) {
      aldeias = r[0].aldeias; tradicoes = r[0].tradicoes; sagas = r[1];
      jogador = r[2].jogador; progresso = r[2].progresso;
      hud();
      if (!jogador.aldeia_id) telaAldeia();
      else if (!jogador.tradicao_id) telaTradicao();
      else telaSagas();
    }).catch(function (e) { telaErro(e.message || "Não foi possível carregar o jogo.", iniciar); });
  }

  // ---------- Criação do personagem ----------
  function listaEscolha(titulo, sub, itens, aoEscolher) {
    var html = '<div class="card fade"><h2>' + titulo + '</h2><p>' + sub + '</p></div>';
    itens.forEach(function (it) {
      html += '<div class="card opcao fade" data-id="' + esc(it.id) + '"><h2>' + esc(it.nome) + '</h2><p>' + esc(it.descricao) + '</p></div>';
    });
    $("tela").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".opcao"), function (el) {
      el.onclick = function () { aoEscolher(el.getAttribute("data-id")); };
    });
  }

  function telaAldeia() {
    listaEscolha("🏘️ Escolha sua aldeia", "De onde você veio? Essa escolha é permanente.", aldeias, function (id) {
      aldeiaEscolhida = id; telaTradicao();
    });
  }

  function telaTradicao() {
    listaEscolha("⚔️ Escolha sua tradição", "Qual caminho você seguirá? Essa escolha é permanente.", tradicoes, function (id) {
      var aldeia = jogador.aldeia_id || aldeiaEscolhida;
      if (!aldeia) return telaAldeia();
      api("/api/perfil", { method: "POST", body: { aldeia_id: aldeia, tradicao_id: id } })
        .then(function (r) { jogador = r.jogador; haptic("success"); telaSagas(); })
        .catch(function (e) { toast(e.message); });
    });
  }

  // ---------- Sagas ----------
  function telaSagas() {
    hud();
    var html = '<div class="card perfil fade"><h2>' + esc(jogador.nome) + '</h2>' +
      '<p>' + esc(nomeDe(aldeias, jogador.aldeia_id)) + '</p>' +
      '<p>' + esc(nomeDe(tradicoes, jogador.tradicao_id)) + '</p>' +
      '<p style="margin-top:8px">Código de convite: <b>' + esc(jogador.codigo_convite) + '</b></p></div>' +
      '<div class="titulo-secao">Sagas</div>';
    sagas.forEach(function (s) {
      var p = progresso[s.id], total = s.capitulos.length, feitos = 0, rotulo = "Nova jornada", classe = "";
      if (p) {
        feitos = p.concluido ? total : Math.max(0, s.capitulos.indexOf(p.ultimo_capitulo));
        rotulo = p.concluido ? "✔ Concluída" : feitos + "/" + total + " capítulos";
        classe = p.concluido ? " done" : "";
      }
      html += '<div class="card opcao fade" data-id="' + esc(s.id) + '"><h2>' + esc(s.titulo) + '</h2><p>' + esc(s.descricao) +
        '</p><span class="tag' + classe + '">' + rotulo + '</span></div>';
    });
    $("tela").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".opcao"), function (el) {
      el.onclick = function () { abrirSaga(el.getAttribute("data-id")); };
    });
  }

  function sagaPorId(id) { for (var i = 0; i < sagas.length; i++) if (sagas[i].id === id) return sagas[i]; return null; }

  function abrirSaga(sagaId) {
    var s = sagaPorId(sagaId), p = progresso[sagaId];
    if (!s || !s.primeiro_capitulo) return;
    mostrarCapitulo(sagaId, (p && !p.concluido) ? p.ultimo_capitulo : s.primeiro_capitulo);
  }

  // ---------- Capítulo ----------
  function mostrarCapitulo(sagaId, capId) {
    api("/api/saga/" + encodeURIComponent(sagaId) + "/capitulo/" + encodeURIComponent(capId)).then(function (cap) {
      var s = sagaPorId(sagaId), p = progresso[sagaId];
      var nivelMin = (cap.requisito && cap.requisito.nivel) || 0;
      if (jogador.nivel < nivelMin) {
        $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
          '</h2><p class="locked">🔒 Requer nível ' + nivelMin + '. Você está no nível ' + jogador.nivel + '.</p>' +
          '<button class="sec" id="voltar">Voltar</button></div>';
        $("voltar").onclick = telaSagas;
        return;
      }
      var ehAtual = (!p && cap.id === s.primeiro_capitulo) || (p && !p.concluido && p.ultimo_capitulo === cap.id);
      var rec = cap.recompensas || {}, recTxt = [];
      if (rec.exp) recTxt.push("+" + rec.exp + " EXP");
      if (rec.moedas) recTxt.push("+" + rec.moedas + " 🪙");

      $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
        '</h2><p class="texto">' + esc(cap.texto) + '</p>' +
        (ehAtual && recTxt.length ? '<div class="reward">Recompensa: ' + recTxt.join(" · ") + '</div>' : '') +
        '<button id="continuar">' + (cap.proximo ? "Continuar ➜" : "Concluir saga ✨") + '</button>' +
        '<button class="sec" id="voltar">Voltar às sagas</button></div>';
      $("voltar").onclick = telaSagas;
      $("continuar").onclick = function () { concluir(sagaId, cap); };
    }).catch(function (e) { telaErro(e.message, function () { mostrarCapitulo(sagaId, capId); }); });
  }

  function concluir(sagaId, cap) {
    var btn = $("continuar"); btn.disabled = true;
    api("/api/saga/" + encodeURIComponent(sagaId) + "/capitulo/" + encodeURIComponent(cap.id) + "/concluir", { method: "POST" })
      .then(function (r) {
        jogador = r.jogador; progresso = r.progresso; hud();
        var msgs = [];
        if (r.recompensa) {
          var t = [];
          if (r.recompensa.exp) t.push("+" + r.recompensa.exp + " EXP");
          if (r.recompensa.moedas) t.push("+" + r.recompensa.moedas + " 🪙");
          if (t.length) msgs.push(t.join(" · "));
        }
        if (r.subiu_nivel) msgs.push("⭐ Nível " + jogador.nivel + "!");
        (r.conquistas || []).forEach(function (c) {
          msgs.push(c.icone + " " + c.nome + (c.recompensa_valor ? " (+" + c.recompensa_valor + " " + c.recompensa_tipo + ")" : ""));
        });
        if (msgs.length) { toast(msgs.join("\n"), 3200); haptic("success"); }

        if (cap.proximo) return mostrarCapitulo(sagaId, cap.proximo);
        $("tela").innerHTML = '<div class="card fade"><h2>🏆 Saga concluída!</h2>' +
          '<p>Você terminou esta jornada. Novos capítulos virão em breve.</p><button id="voltar2">Voltar às sagas</button></div>';
        $("voltar2").onclick = telaSagas;
      })
      .catch(function (e) { btn.disabled = false; toast(e.message); });
  }

  iniciar();
})();
</script>
</body>
</html>
