<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistérios de Kazan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0a1f; --card: #1a1333; --card2: #241a45; --text: #efe9ff;
    --muted: #a99fcb; --gold: #f4c95d; --accent: #8b5cf6; --ok: #4ade80; --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #3b2a7a 0%, transparent 60%), var(--bg);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0); }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { text-align: center; padding: 8px 0 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; color: var(--gold); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border: 1px solid #2f2459; border-radius: 12px; padding: 10px 4px; text-align: center; }
  .stat b { display: block; font-size: 17px; }
  .stat span { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bar { height: 6px; background: #2a2150; border-radius: 99px; overflow: hidden; margin: -6px 0 16px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .5s; }

  .card { background: var(--card); border: 1px solid #2f2459; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); line-height: 1.5; }
  .opcao { cursor: pointer; transition: transform .1s, border-color .2s; }
  .opcao:active { transform: scale(.98); border-color: var(--accent); }
  .tag { display: inline-block; margin-top: 10px; font-size: 12px; padding: 3px 10px; border-radius: 99px; background: var(--card2); color: var(--muted); }
  .tag.done { color: var(--ok); }
  .perfil p { font-size: 14px; margin-top: 2px; }
  .perfil b { color: var(--text); }
  .titulo-secao { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .8px; margin: 18px 4px 8px; }

  .capitulo .titulo { font-size: 22px; margin: 0 0 12px; color: var(--gold); }
  .capitulo .texto { font-size: 17px; line-height: 1.7; margin: 0; color: var(--text); }
  .reward { margin-top: 14px; font-size: 14px; color: var(--ok); }
  .locked { color: var(--bad); }

  button { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px; font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6d3df0); }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .6; }
  button.sec { background: var(--card2); color: var(--muted); font-weight: 500; }

  .mapa { position: relative; width: 100%; aspect-ratio: 360/560; border-radius: 20px; overflow: hidden; border: 1px solid #2f2459;
    background: linear-gradient(#2b1d5e, #150f2e 45%, #0f0a1f); }
  .mapa svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  button.pin { position: absolute; transform: translate(-50%, -50%); width: 62px; margin: 0; padding: 0; background: none; border-radius: 0; font-size: 11px; font-weight: 600; color: var(--text); }
  button.pin:active { transform: translate(-50%, -50%) scale(.94); }
  .pin .ico { display: flex; width: 58px; height: 58px; margin: 0 auto; border-radius: 50%; align-items: center; justify-content: center; font-size: 28px;
    background: radial-gradient(circle at 30% 30%, #5b3fc4, #2a1f5c); border: 2px solid var(--gold); box-shadow: 0 0 18px rgba(244,201,93,.35); }
  .pin .nome { display: block; margin-top: 4px; line-height: 1.15; text-shadow: 0 1px 3px #000; }
  .pin.bloq { opacity: .65; } .pin.bloq .ico { filter: grayscale(.7); border-color: #4a4070; box-shadow: none; }
  .abas { display: flex; gap: 8px; margin-bottom: 10px; }
  button.aba { margin: 0; padding: 10px; font-size: 14px; background: var(--card2); color: var(--muted); }
  button.aba.on { background: linear-gradient(135deg, var(--accent), #6d3df0); color: #fff; }
  .mapa.dia { background: linear-gradient(#5b8bd9, #8f6fd1 50%, #2b1d5e); }
  .mapa.tarde { background: linear-gradient(#e8845a, #8a3f8f 50%, #2b1d5e); }
  .eu { position: absolute; transform: translate(-50%, -50%); font-size: 22px; transition: left .4s ease, top .4s ease; pointer-events: none; z-index: 2; }
  .aviso { position: absolute; top: -2px; right: 6px; width: 13px; height: 13px; border-radius: 50%; background: var(--bad); border: 2px solid #fff; animation: pulso 1.4s infinite; }
  .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 9; background: var(--card); border-top: 1px solid var(--gold); border-radius: 20px 20px 0 0;
    padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateY(105%); transition: transform .3s; }
  .sheet.abre { transform: none; }
  .sheet h2 { margin: 0 0 6px; font-size: 18px; } .sheet p { margin: 0; color: var(--muted); }
  .pin .ico { animation: flutua 3.2s ease-in-out infinite; }
  .pin.bloq .ico { animation: respira 4s infinite; }
  .estrela { animation: pisca 3s infinite; }
  .mapa path { animation: anda 2s linear infinite; }
  @keyframes flutua { 50% { transform: translateY(-4px); } }
  @keyframes pisca { 50% { opacity: .2; } }
  @keyframes respira { 50% { opacity: .3; } }
  @keyframes pulso { 50% { transform: scale(1.45); opacity: .55; } }
  @keyframes anda { to { stroke-dashoffset: -9; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  .item { border-width: 2px; }
  .itemtop { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
  .itemtop h2 { margin: 0; font-size: 16px; }
  .itemico { flex: none; width: 54px; height: 54px; border-radius: 14px; border: 2px solid; display: flex; align-items: center; justify-content: center; font-size: 28px; overflow: hidden; }
  .itemico img { width: 100%; height: 100%; object-fit: cover; }
  .rar { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .5px; }
  .muted { color: var(--muted); font-size: 12px; }
  .bonus { font-weight: 700; margin-top: 6px !important; }
  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
  button.chip { width: auto; flex: none; margin: 0; padding: 8px 12px; font-size: 13px; background: var(--card2); color: var(--muted); font-weight: 500; border-radius: 99px; }
  button.chip.on { background: linear-gradient(135deg, var(--accent), #6d3df0); color: #fff; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0; max-width: 90%; text-align: center;
    background: var(--card2); border: 1px solid var(--gold); color: var(--gold); padding: 10px 18px; border-radius: 16px; font-size: 14px;
    transition: all .3s; pointer-events: none; z-index: 10; white-space: pre-line; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌙 Mistérios de Kazan</h1>
    <p>A Grande Academia o aguarda</p>
  </header>

  <div class="stats" id="stats" style="display:none">
    <div class="stat"><b id="nivel">1</b><span>Nível</span></div>
    <div class="stat"><b id="exp">0</b><span>EXP</span></div>
    <div class="stat"><b id="moedas">0</b><span>Moedas</span></div>
    <div class="stat"><b id="eter">0</b><span>Éter</span></div>
    <div class="stat"><b id="energia">0</b><span>Energia</span></div>
  </div>
  <div class="bar" id="barraBox" style="display:none"><i id="barra"></i></div>

  <main id="tela"></main>
</div>
<div class="toast" id="toast"></div>
<div class="sheet" id="sheet"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0f0a1f"); tg.setBackgroundColor("#0f0a1f"); } catch (e) {} }

  var jogador = null, progresso = {}, aldeias = [], tradicoes = [], sagas = [], cidade = { locais: [], refeicoes: [], rumores: [] };
  var aldeiaEscolhida = null;

  function $(id) { return document.getElementById(id); }
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
  function nomeDe(lista, id) { for (var i = 0; i < lista.length; i++) if (lista[i].id === id) return lista[i].nome; return "—"; }

  function toast(msg, ms) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, ms || 2400);
  }
  function haptic(tipo) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(tipo || "success"); } catch (e) {} }

  function api(url, opcoes) {
    opcoes = opcoes || {};
    opcoes.headers = Object.assign({ "X-Telegram-Init-Data": (tg && tg.initData) || "" }, opcoes.headers || {});
    if (opcoes.body && typeof opcoes.body !== "string") {
      opcoes.body = JSON.stringify(opcoes.body);
      opcoes.headers["Content-Type"] = "application/json";
    }
    return fetch(url, opcoes).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (j) {
        if (!r.ok) { var e = new Error(j.erro || ("Erro " + r.status)); e.status = r.status; throw e; }
        return j;
      });
    });
  }

  function hud() {
    if (!jogador) return;
    $("stats").style.display = "flex"; $("barraBox").style.display = "block";
    $("nivel").textContent = jogador.nivel;
    $("exp").textContent = jogador.exp;
    $("moedas").textContent = jogador.moedas;
    $("eter").textContent = jogador.moedas_eter;
    $("energia").textContent = jogador.energia;
    $("barra").style.width = (jogador.exp % 100) + "%";
  }

  function telaErro(msg, retry) {
    $("tela").innerHTML = '<div class="card fade"><h2>⚠️ Ops</h2><p>' + esc(msg) + '</p>' +
      (retry ? '<button id="tentar">Tentar de novo</button>' : '') + '</div>';
    if (retry) $("tentar").onclick = retry;
  }

  // ---------- Início ----------
  function iniciar() {
    if (!tg || !tg.initData) {
      return telaErro("Abra o jogo pelo botão “Jogar Kazan” dentro do Telegram.");
    }
    $("tela").innerHTML = '<div class="card"><p>Carregando…</p></div>';
    Promise.all([api("/api/dados"), api("/api/sagas"), api("/api/jogador"), api("/api/cidade")]).then(function (r) {
      aldeias = r[0].aldeias; tradicoes = r[0].tradicoes; sagas = r[1];
      jogador = r[2].jogador; progresso = r[2].progresso; cidade = r[3];
      hud();
      if (!jogador.aldeia_id) telaAldeia();
      else if (!jogador.tradicao_id) telaTradicao();
      else telaCidade();
    }).catch(function (e) { telaErro(e.message || "Não foi possível carregar o jogo.", iniciar); });
  }

  // ---------- Criação do personagem ----------
  function listaEscolha(titulo, sub, itens, aoEscolher) {
    var html = '<div class="card fade"><h2>' + titulo + '</h2><p>' + sub + '</p></div>';
    itens.forEach(function (it) {
      html += '<div class="card opcao fade" data-id="' + esc(it.id) + '"><h2>' + esc(it.nome) + '</h2><p>' + esc(it.descricao) + '</p></div>';
    });
    $("tela").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll(".opcao"), function (el) {
      el.onclick = function () { aoEscolher(el.getAttribute("data-id")); };
    });
  }

  function telaAldeia() {
    listaEscolha("🏘️ Escolha sua aldeia", "De onde você veio? Essa escolha é permanente.", aldeias, function (id) {
      aldeiaEscolhida = id; telaTradicao();
    });
  }

  function telaTradicao() {
    listaEscolha("⚔️ Escolha sua tradição", "Qual caminho você seguirá? Essa escolha é permanente.", tradicoes, function (id) {
      var aldeia = jogador.aldeia_id || aldeiaEscolhida;
      if (!aldeia) return telaAldeia();
      api("/api/perfil", { method: "POST", body: { aldeia_id: aldeia, tradicao_id: id } })
        .then(function (r) { jogador = r.jogador; haptic("success"); telaCidade(); })
        .catch(function (e) { toast(e.message); });
    });
  }

  // ---------- Cidade ----------
  let areaAtual = "centro", avisos = [];

  function telaCidade(semBuscar) {
    hud();
    const locais = cidade.locais.filter(l => l.area === areaAtual);
    const h = new Date().getHours(), ceu = h >= 6 && h < 17 ? "dia" : h >= 17 && h < 19 ? "tarde" : "noite";
    let paths = "", pins = "", astros = ceu === "noite"
      ? '<circle cx="46" cy="44" r="20" fill="#f4c95d" opacity=".9"/><circle cx="54" cy="38" r="18" fill="#2b1d5e"/>'
      : '<circle cx="46" cy="' + (ceu === "dia" ? 44 : 90) + '" r="20" fill="#ffe08a"/>';
    if (ceu === "noite") [[300, 40], [250, 90], [120, 30], [330, 120], [90, 100]].forEach((e, i) =>
      astros += `<circle class="estrela" style="animation-delay:${i * .7}s" cx="${e[0]}" cy="${e[1]}" r="1.6" fill="#fff"/>`);
    locais.forEach((l, i) => {
      const x = l.x * 3.6, y = l.y * 5.6;
      paths += `<path d="M180 280 Q${(180 + x) / 2 + (y > 280 ? 18 : -18)} ${(280 + y) / 2} ${x} ${y}"/>`;
      pins += `<button class="pin${l.pronto ? "" : " bloq"}" data-id="${l.id}" style="left:${l.x}%;top:${l.y}%">` +
        `<span class="ico" style="animation-delay:${i * .4}s">${l.icone}</span>${avisos.includes(l.id) ? '<i class="aviso"></i>' : ""}</button>`;
    });
    $("tela").innerHTML = '<div class="abas">' + cidade.areas.map(a =>
      `<button class="aba${a.id === areaAtual ? " on" : ""}" data-area="${a.id}">${a.icone} ${a.nome}</button>`).join("") + '</div>' +
      `<div class="mapa ${ceu} fade"><svg viewBox="0 0 360 560" preserveAspectRatio="none">${astros}` +
      `<g fill="none" stroke="#f4c95d" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 7" stroke-linecap="round">${paths}</g>` +
      '<circle cx="180" cy="280" r="26" fill="#241a45" stroke="#f4c95d" stroke-opacity=".5"/><text x="180" y="289" text-anchor="middle" font-size="26">⛲</text></svg>' +
      pins + '<div class="eu" id="eu" style="left:50%;top:50%">🧙</div></div>';
    document.querySelectorAll(".aba").forEach(b => b.onclick = () => { areaAtual = b.dataset.area; fecharSheet(); telaCidade(); });
    document.querySelectorAll(".pin").forEach(b => b.onclick = e => { e.stopPropagation(); tocarLocal(locais.find(l => l.id === b.dataset.id)); });
    $("tela").querySelector(".mapa").onclick = fecharSheet;
    if (semBuscar !== true) api("/api/avisos").then(a => {
      if (JSON.stringify(a) !== JSON.stringify(avisos)) { avisos = a; if (document.querySelector(".mapa")) telaCidade(true); }
    }).catch(() => {});
  }

  function fecharSheet() { $("sheet").classList.remove("abre"); }

  function tocarLocal(l) {
    $("eu").style.left = l.x + "%"; $("eu").style.top = l.y + "%";   // o personagem anda até o local
    setTimeout(() => {
      $("sheet").innerHTML = `<h2>${l.icone} ${esc(l.nome)}</h2><p>${esc(l.descricao)}</p>` +
        `<button id="entrar"${l.pronto ? "" : " disabled"}>${l.pronto ? "Entrar" : "🌫️ Encoberto pela névoa — em breve"}</button>`;
      $("sheet").classList.add("abre");
      $("entrar").onclick = () => { fecharSheet(); abrirLocal(l.id); };
    }, 400);
  }

  function abrirLocal(id) {
    ({ academia: telaSagas, taverna: telaTaverna, casa: telaCasa, missoes: telaMissoes, conquistas: telaConquistas,
       banco: telaBanco, portal: telaPortal, praca: telaPraca, mercado: telaMercado, ferraria: telaFerraria })[id]();
  }

  function pagina(corpo) {
    $("tela").innerHTML = corpo + '<button class="sec" id="cid">🗺️ Voltar à cidade</button>';
    $("cid").onclick = () => telaCidade();
  }
  function aplicar(r) {
    jogador = r.jogador; hud();
    const m = [];
    if (r.subiu_nivel) m.push("⭐ Nível " + jogador.nivel + "!");
    (r.conquistas || []).forEach(c => m.push(c.icone + " " + c.nome));
    if (m.length) { toast(m.join("\n"), 3200); haptic("success"); }
  }
  function acao(url, corpo, depois) { api(url, { method: "POST", body: corpo }).then(r => { aplicar(r); depois(r); }).catch(e => toast(e.message)); }

  function telaMissoes() {
    api("/api/missoes").then(ms => {
      pagina('<div class="titulo-secao">📜 Missões de hoje</div>' + ms.map(m => {
        const pronta = m.progresso >= m.meta;
        return `<div class="card"><h2>${esc(m.nome)}</h2><p>${esc(m.descricao)} (${m.progresso}/${m.meta})</p><p class="reward">+${m.exp} EXP · +${m.moedas} 🪙</p>` +
          `<button data-m="${m.id}"${pronta && !m.coletada ? "" : " disabled"}>${m.coletada ? "✔ Coletada" : pronta ? "Coletar" : "Em andamento"}</button></div>`;
      }).join(""));
      document.querySelectorAll("[data-m]").forEach(b => b.onclick = () => acao("/api/missoes/" + b.dataset.m + "/coletar", {}, telaMissoes));
    }).catch(e => telaErro(e.message, telaMissoes));
  }

  function telaConquistas() {
    api("/api/conquistas").then(cs => pagina('<div class="titulo-secao">🏅 Conquistas</div>' + cs.map(c =>
      `<div class="card" style="opacity:${c.conquistada ? 1 : .55}"><h2>${c.icone} ${esc(c.nome)}</h2><p>${esc(c.descricao)}</p>` +
      `<span class="tag${c.conquistada ? " done" : ""}">${c.conquistada ? "✔ Conquistada" : "🔒 +" + c.recompensa_valor + " " + c.recompensa_tipo}</span></div>`).join("")))
      .catch(e => telaErro(e.message, telaConquistas));
  }

  function telaBanco() {
    hud();
    pagina(`<div class="card"><h2>🏦 Banco do Éter</h2><p>Troque moedas por Éter, a moeda rara. Taxa: ${cidade.taxa_eter} 🪙 = 1 Éter.</p></div>` +
      [1, 5].map(q => `<button data-q="${q}"${jogador.moedas < q * cidade.taxa_eter ? " disabled" : ""}>Converter ${q} Éter (${q * cidade.taxa_eter} 🪙)</button>`).join(""));
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => acao("/api/banco/converter", { qtd: +b.dataset.q }, () => { toast("✨ +" + b.dataset.q + " Éter"); telaBanco(); }));
  }

  function telaPortal(txt) {
    hud();
    pagina(`<div class="card"><h2>🌀 Portal das Brumas</h2><p>Explorar custa ${cidade.custo_explorar} ⚡ (você tem ${jogador.energia}).</p>${txt ? `<p class="reward">${txt}</p>` : ""}</div>` +
      `<button id="go"${jogador.energia < cidade.custo_explorar ? " disabled" : ""}>🌀 Explorar</button>`);
    $("go").onclick = () => acao("/api/portal/explorar", {}, r =>
      telaPortal(esc(r.texto) + "<br>+" + r.exp + " EXP · +" + r.moedas + " 🪙" + (r.eter ? " · +1 Éter ✨" : "")));
  }

  function telaPraca() {
    api("/api/ranking").then(r => pagina('<div class="titulo-secao">🏘️ Ranking · você está em ' + r.minha + 'º</div>' + r.top.map((p, i) =>
      `<div class="card"><h2>${i + 1}º ${esc(p.nome)}</h2><p>Nível ${p.nivel} · ${p.exp} EXP · ${esc(nomeDe(aldeias, p.aldeia_id))}</p></div>`).join("")))
      .catch(e => telaErro(e.message, telaPraca));
  }

  // ---------- Itens: cartões, Mochila, Mercado e Ferraria ----------
  const NOME_CAT = { arma: "⚔️ Arma", armadura: "🛡️ Armadura", amuleto: "📿 Amuleto", pet: "🐾 Pet", consumivel: "🧪 Consumível" };
  const CATS = [["todos", "Todos"], ["arma", "⚔️ Armas"], ["armadura", "🛡️ Armaduras"], ["amuleto", "📿 Amuletos"], ["pet", "🐾 Pets"], ["consumivel", "🧪 Consumíveis"]];
  const FAIXAS = [[0, 100, "Todos os níveis"], [1, 20, "Nv 1–20"], [21, 40, "Nv 21–40"], [41, 60, "Nv 41–60"], [61, 80, "Nv 61–80"], [81, 100, "Nv 81–100"]];
  let fCat = "arma", fNiv = 0, restaurar = null;

  function bonusTxt(b, m) {
    const n = { exp: "EXP", moedas: "moedas", eter: "chance de Éter" };
    return Object.keys(b || {}).map(k => "+" + Math.round(b[k] * (m || 1) * 10) / 10 + "% " + n[k]).join(" · ");
  }
  function efeitoTxt(e) {
    return Object.keys(e || {}).map(k => "+" + e[k] + (k === "energia" ? " ⚡" : k === "exp" ? " EXP" : " 🪙")).join(" · ");
  }
  function cartaoItem(i, botoes, mult) {
    const r = cidade.raridades.find(x => x.id === i.raridade) || { cor: "#9aa4b2", nome: "" };
    const st = { ataque: "⚔️", defesa: "🛡️", vida: "❤️" };
    const stats = Object.keys(i.stats || {}).map(k => st[k] + " " + i.stats[k]).join("   ");
    return `<div class="card item" style="border-color:${r.cor};box-shadow:0 0 12px ${r.cor}33">` +
      `<div class="itemtop"><span class="itemico" style="border-color:${r.cor};background:radial-gradient(circle at 30% 30%,${r.cor}55,#1a1333)">` +
      `${i.imagem ? `<img src="${esc(i.imagem)}" alt="">` : i.icone}</span>` +
      `<div><h2>${esc(i.nome)}${i.nivel ? " ✨+" + i.nivel : ""}</h2><span class="rar" style="color:${r.cor}">${r.nome}</span>` +
      ` <span class="muted">· ${NOME_CAT[i.categoria]} · Nv ${i.nivel_min}</span></div></div>` +
      (stats ? `<p>${stats}</p>` : "") +
      (i.bonus ? `<p class="bonus" style="color:${r.cor}">${bonusTxt(i.bonus, mult)} ao explorar</p>` : "") +
      (i.efeito ? `<p class="bonus" style="color:${r.cor}">${efeitoTxt(i.efeito)}</p>` : "") + (botoes || "") + "</div>";
  }

  function telaCasa() {
    api("/api/inventario").then(its => {
      its.sort((a, b) => CATS.findIndex(c => c[0] === a.categoria) - CATS.findIndex(c => c[0] === b.categoria));
      pagina(`<div class="card perfil"><h2>🏠 ${esc(jogador.nome)}</h2><p>${esc(nomeDe(aldeias, jogador.aldeia_id))}</p><p>${esc(nomeDe(tradicoes, jogador.tradicao_id))}</p>` +
        `<p style="margin-top:8px">Código de convite: <b>${esc(jogador.codigo_convite)}</b></p></div><div class="titulo-secao">🎒 Mochila</div>` +
        (its.length ? its.map(i => {
          const eq = i.tipo === "equip";
          return cartaoItem(i, `<button data-u="${i.id}" data-t="${eq ? "equipar" : "usar"}">${eq ? (i.equipado ? "✔ Equipado (tocar remove)" : "Equipar") : "Usar" + (i.qtd > 1 ? " (×" + i.qtd + ")" : "")}</button>`, 1 + i.nivel);
        }).join("") : '<div class="card"><p>Vazia. Visite o Mercado das Sombras, nos Arredores.</p></div>'));
      document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => acao("/api/inventario/" + b.dataset.t, { id: b.dataset.u }, telaCasa));
    }).catch(e => telaErro(e.message, telaCasa));
  }

  function telaMercado() {
    api("/api/mercado").then(its => {
      const f = FAIXAS[fNiv];
      const lista = its.filter(i => (fCat === "todos" || i.categoria === fCat) && i.nivel_min >= f[0] && i.nivel_min <= f[1]);
      pagina('<div class="titulo-secao">🏪 Mercado das Sombras · ' + lista.length + ' itens</div>' +
        '<div class="chips">' + CATS.map(c => `<button class="chip${c[0] === fCat ? " on" : ""}" data-cat="${c[0]}">${c[1]}</button>`).join("") + "</div>" +
        '<div class="chips">' + FAIXAS.map((x, k) => `<button class="chip${k === fNiv ? " on" : ""}" data-niv="${k}">${x[2]}</button>`).join("") + "</div>" +
        (lista.length ? lista.map(i => {
          const tem = i.tipo === "equip" && i.qtd > 0, trava = jogador.nivel < i.nivel_min;
          return cartaoItem(i, `<button data-c="${i.id}"${tem || trava || jogador.moedas < i.preco ? " disabled" : ""}>` +
            `${tem ? "Já possui" : trava ? "🔒 Requer nível " + i.nivel_min : "Comprar · " + i.preco + " 🪙"}</button>` +
            (i.qtd ? `<button class="sec" data-v="${i.id}">Vender${i.qtd > 1 ? " (×" + i.qtd + ")" : ""} · ${i.venda} 🪙</button>` : ""));
        }).join("") : '<div class="card"><p>Nenhum item nesta combinação.</p></div>'));
      document.querySelectorAll("[data-cat]").forEach(b => b.onclick = () => { fCat = b.dataset.cat; telaMercado(); });
      document.querySelectorAll("[data-niv]").forEach(b => b.onclick = () => { fNiv = +b.dataset.niv; telaMercado(); });
      const mexer = (sel, url) => document.querySelectorAll(sel).forEach(b => b.onclick = () => {
        const y = window.scrollY; acao(url, { id: b.dataset.c || b.dataset.v }, () => { restaurar = y; telaMercado(); });
      });
      mexer("[data-c]", "/api/mercado/comprar"); mexer("[data-v]", "/api/mercado/vender");
      if (restaurar !== null) { window.scrollTo(0, restaurar); restaurar = null; }
    }).catch(e => telaErro(e.message, telaMercado));
  }

  function telaFerraria() {
    api("/api/ferraria").then(its => {
      pagina('<div class="titulo-secao">🔨 Ferraria · melhorias até +' + cidade.max_melhoria + '</div>' + (its.length ? its.map(i =>
        cartaoItem(i, `<button data-f="${i.id}"${i.custo === null || jogador.moedas < i.custo ? " disabled" : ""}>` +
          `${i.custo === null ? "Nível máximo" : "Melhorar · " + i.custo + " 🪙"}</button>`, 1 + i.nivel)).join("")
        : '<div class="card"><p>Você ainda não tem equipamentos. Compre um no Mercado das Sombras.</p></div>'));
      document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => acao("/api/ferraria/melhorar", { id: b.dataset.f }, () => { toast("🔨 Melhorado!"); telaFerraria(); }));
    }).catch(e => telaErro(e.message, telaFerraria));
  }

  function telaTaverna() {
    hud();
    var r = cidade.rumores, cheia = jogador.energia >= cidade.energia_max;
    var html = '<div class="card fade"><h2>🍺 Taverna da Lua</h2><p>Energia: <b>' + jogador.energia + '/' + cidade.energia_max +
      '</b> · recupera 1 a cada ' + cidade.min_por_energia + ' min.</p></div>';
    cidade.refeicoes.forEach(function (f) {
      var pobre = jogador.moedas < f.custo;
      html += '<div class="card fade"><h2>' + esc(f.nome) + '</h2><p>+' + f.energia + ' ⚡ · ' + f.custo + ' 🪙</p><button data-id="' + f.id + '"' +
        (cheia || pobre ? " disabled" : "") + '>' + (cheia ? "Energia cheia" : pobre ? "Moedas insuficientes" : "Comprar") + '</button></div>';
    });
    html += '<div class="card fade"><p>💬 ' + esc(r[Math.floor(Math.random() * r.length)]) + '</p></div><button class="sec" id="cid">🗺️ Voltar à cidade</button>';
    $("tela").innerHTML = html;
    Array.prototype.forEach.call(document.querySelectorAll("button[data-id]"), function (b) {
      b.onclick = function () {
        b.disabled = true;
        api("/api/taverna/refeicao", { method: "POST", body: { id: b.getAttribute("data-id") } })
          .then(function (x) { jogador = x.jogador; haptic("success"); toast("⚡ +" + x.energia_ganha + " energia"); telaTaverna(); })
          .catch(function (e) { toast(e.message); telaTaverna(); });
      };
    });
    $("cid").onclick = telaCidade;
  }

  // ---------- Sagas ----------
  function telaSagas() {
    hud();
    var html = '<div class="titulo-secao">🏛️ Grande Academia</div>';
    sagas.forEach(function (s) {
      var p = progresso[s.id], total = s.capitulos.length, feitos = 0, rotulo = "Nova jornada", classe = "";
      if (p) {
        feitos = p.concluido ? total : Math.max(0, s.capitulos.indexOf(p.ultimo_capitulo));
        rotulo = p.concluido ? "✔ Concluída" : feitos + "/" + total + " capítulos";
        classe = p.concluido ? " done" : "";
      }
      html += '<div class="card opcao fade" data-id="' + esc(s.id) + '"><h2>' + esc(s.titulo) + '</h2><p>' + esc(s.descricao) +
        '</p><span class="tag' + classe + '">' + rotulo + '</span></div>';
    });
    html += '<button class="sec" id="cid">🗺️ Voltar à cidade</button>';
    $("tela").innerHTML = html;
    $("cid").onclick = telaCidade;
    Array.prototype.forEach.call(document.querySelectorAll(".opcao"), function (el) {
      el.onclick = function () { abrirSaga(el.getAttribute("data-id")); };
    });
  }

  function sagaPorId(id) { for (var i = 0; i < sagas.length; i++) if (sagas[i].id === id) return sagas[i]; return null; }

  function abrirSaga(sagaId) {
    var s = sagaPorId(sagaId), p = progresso[sagaId];
    if (!s || !s.primeiro_capitulo) return;
    mostrarCapitulo(sagaId, (p && !p.concluido) ? p.ultimo_capitulo : s.primeiro_capitulo);
  }

  // ---------- Capítulo ----------
  function mostrarCapitulo(sagaId, capId) {
    api("/api/saga/" + encodeURIComponent(sagaId) + "/capitulo/" + encodeURIComponent(capId)).then(function (cap) {
      var s = sagaPorId(sagaId), p = progresso[sagaId];
      var nivelMin = (cap.requisito && cap.requisito.nivel) || 0;
      if (jogador.nivel < nivelMin) {
        $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
          '</h2><p class="locked">🔒 Requer nível ' + nivelMin + '. Você está no nível ' + jogador.nivel + '.</p>' +
          '<button class="sec" id="voltar">Voltar</button></div>';
        $("voltar").onclick = telaSagas;
        return;
      }
      var ehAtual = (!p && cap.id === s.primeiro_capitulo) || (p && !p.concluido && p.ultimo_capitulo === cap.id);
      var rec = cap.recompensas || {}, recTxt = [];
      if (rec.exp) recTxt.push("+" + rec.exp + " EXP");
      if (rec.moedas) recTxt.push("+" + rec.moedas + " 🪙");

      $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
        '</h2><p class="texto">' + esc(cap.texto) + '</p>' +
        (ehAtual && recTxt.length ? '<div class="reward">Recompensa: ' + recTxt.join(" · ") + '</div>' : '') +
        '<button id="continuar">' + (cap.proximo ? "Continuar ➜" : "Concluir saga ✨") + '</button>' +
        '<button class="sec" id="voltar">Voltar às sagas</button></div>';
      $("voltar").onclick = telaSagas;
      $("continuar").onclick = function () { concluir(sagaId, cap); };
    }).catch(function (e) { telaErro(e.message, function () { mostrarCapitulo(sagaId, capId); }); });
  }

  function concluir(sagaId, cap) {
    var btn = $("continuar"); btn.disabled = true;
    api("/api/saga/" + encodeURIComponent(sagaId) + "/capitulo/" + encodeURIComponent(cap.id) + "/concluir", { method: "POST" })
      .then(function (r) {
        jogador = r.jogador; progresso = r.progresso; hud();
        var msgs = [];
        if (r.recompensa) {
          var t = [];
          if (r.recompensa.exp) t.push("+" + r.recompensa.exp + " EXP");
          if (r.recompensa.moedas) t.push("+" + r.recompensa.moedas + " 🪙");
          if (t.length) msgs.push(t.join(" · "));
        }
        if (r.subiu_nivel) msgs.push("⭐ Nível " + jogador.nivel + "!");
        (r.conquistas || []).forEach(function (c) {
          msgs.push(c.icone + " " + c.nome + (c.recompensa_valor ? " (+" + c.recompensa_valor + " " + c.recompensa_tipo + ")" : ""));
        });
        if (msgs.length) { toast(msgs.join("\n"), 3200); haptic("success"); }

        if (cap.proximo) return mostrarCapitulo(sagaId, cap.proximo);
        $("tela").innerHTML = '<div class="card fade"><h2>🏆 Saga concluída!</h2>' +
          '<p>Você terminou esta jornada. Novos capítulos virão em breve.</p><button id="voltar2">Voltar às sagas</button></div>';
        $("voltar2").onclick = telaSagas;
      })
      .catch(function (e) { btn.disabled = false; toast(e.message); });
  }

  iniciar();
})();
</script>
</body>
</html>
