<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mistérios de Kazan</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f0a1f;
    --card: #1a1333;
    --card2: #241a45;
    --text: #efe9ff;
    --muted: #a99fcb;
    --gold: #f4c95d;
    --accent: #8b5cf6;
    --ok: #4ade80;
    --bad: #f87171;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body {
    min-height: 100vh;
    background: radial-gradient(1200px 600px at 50% -10%, #3b2a7a 0%, transparent 60%), var(--bg);
    padding: env(safe-area-inset-top, 0) 0 env(safe-area-inset-bottom, 0);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 16px; }
  header { text-align: center; padding: 8px 0 14px; }
  header h1 { margin: 0; font-size: 22px; letter-spacing: .5px; color: var(--gold); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .stats { display: flex; gap: 8px; margin-bottom: 14px; }
  .stat { flex: 1; background: var(--card); border: 1px solid #2f2459; border-radius: 12px;
    padding: 10px 8px; text-align: center; }
  .stat b { display: block; font-size: 18px; }
  .stat span { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; }
  .bar { height: 6px; background: #2a2150; border-radius: 99px; overflow: hidden; margin: -6px 0 16px; }
  .bar > i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--accent), var(--gold)); transition: width .5s; }

  .card { background: var(--card); border: 1px solid #2f2459; border-radius: 16px; padding: 16px; margin-bottom: 12px; }
  .card h2 { margin: 0 0 6px; font-size: 18px; }
  .card p { margin: 0; color: var(--muted); line-height: 1.5; }
  .saga { cursor: pointer; transition: transform .1s, border-color .2s; }
  .saga:active { transform: scale(.98); border-color: var(--accent); }
  .tag { display: inline-block; margin-top: 10px; font-size: 12px; padding: 3px 10px;
    border-radius: 99px; background: var(--card2); color: var(--muted); }
  .tag.done { color: var(--ok); }

  .capitulo .titulo { font-size: 22px; margin: 0 0 12px; color: var(--gold); }
  .capitulo .texto { font-size: 17px; line-height: 1.7; margin: 0; color: var(--text); }
  .reward { margin-top: 14px; font-size: 14px; color: var(--ok); }
  .locked { color: var(--bad); }

  button { width: 100%; padding: 14px; margin-top: 12px; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: 600; color: #fff; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #6d3df0); }
  button:active { transform: scale(.98); }
  button.sec { background: var(--card2); color: var(--muted); font-weight: 500; }
  .link { background: none; color: var(--muted); font-size: 13px; text-decoration: underline; margin-top: 18px; }

  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); opacity: 0;
    background: var(--card2); border: 1px solid var(--gold); color: var(--gold);
    padding: 10px 18px; border-radius: 99px; font-size: 14px; transition: all .3s; pointer-events: none; z-index: 10; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .fade { animation: fade .35s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🌙 Mistérios de Kazan</h1>
    <p>A Grande Academia o aguarda</p>
  </header>

  <div class="stats">
    <div class="stat"><b id="nivel">1</b><span>Nível</span></div>
    <div class="stat"><b id="exp">0</b><span>EXP</span></div>
    <div class="stat"><b id="moedas">0</b><span>Moedas</span></div>
  </div>
  <div class="bar"><i id="barra"></i></div>

  <main id="tela"></main>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  var tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0f0a1f"); tg.setBackgroundColor("#0f0a1f"); } catch (e) {} }

  var CHAVE = "kazan_estado_v1";
  var estado = { exp: 0, moedas: 0, concluidos: {}, atual: {} };

  function carregar() {
    try {
      var s = localStorage.getItem(CHAVE);
      if (s) { var o = JSON.parse(s); if (o && typeof o === "object") estado = Object.assign(estado, o); }
    } catch (e) {}
  }
  function salvar() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (e) {} }
  function nivel() { return 1 + Math.floor(estado.exp / 100); }

  function $(id) { return document.getElementById(id); }
  function esc(t) { var d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }

  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    setTimeout(function () { t.classList.remove("show"); }, 2200);
  }
  function haptic(tipo) { try { tg && tg.HapticFeedback && tg.HapticFeedback.notificationOccurred(tipo || "success"); } catch (e) {} }

  function atualizarHud() {
    $("nivel").textContent = nivel();
    $("exp").textContent = estado.exp;
    $("moedas").textContent = estado.moedas;
    $("barra").style.width = (estado.exp % 100) + "%";
  }

  function api(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
  }

  function erro(msg) {
    $("tela").innerHTML = '<div class="card fade"><h2>⚠️ Ops</h2><p>' + esc(msg) +
      '</p><button id="tentar">Tentar de novo</button></div>';
    $("tentar").onclick = telaSagas;
  }

  // ---------- Tela: lista de sagas ----------
  function telaSagas() {
    atualizarHud();
    $("tela").innerHTML = '<div class="card"><p>Carregando…</p></div>';
    api("/api/sagas").then(function (sagas) {
      var html = "";
      sagas.forEach(function (s) {
        var feitos = (estado.concluidos[s.id] || []).length;
        html += '<div class="card saga fade" data-id="' + esc(s.id) + '">' +
          '<h2>' + esc(s.titulo) + '</h2><p>' + esc(s.descricao) + '</p>' +
          '<span class="tag' + (feitos ? " done" : "") + '">' +
          (feitos ? "✔ " + feitos + " capítulo(s) concluído(s)" : "Nova jornada") + '</span></div>';
      });
      html += '<button class="link" id="reset">Reiniciar progresso</button>';
      $("tela").innerHTML = html;
      Array.prototype.forEach.call(document.querySelectorAll(".saga"), function (el) {
        el.onclick = function () { abrirSaga(el.getAttribute("data-id")); };
      });
      $("reset").onclick = function () {
        if (confirm("Apagar todo o seu progresso?")) {
          estado = { exp: 0, moedas: 0, concluidos: {}, atual: {} };
          salvar(); telaSagas();
        }
      };
    }).catch(function () { erro("Não foi possível carregar as sagas."); });
  }

  // ---------- Abrir saga (continua de onde parou) ----------
  function abrirSaga(sagaId) {
    var capSalvo = estado.atual[sagaId];
    if (capSalvo) return mostrarCapitulo(sagaId, capSalvo);
    api("/api/saga/" + encodeURIComponent(sagaId) + "/inicio")
      .then(function (cap) { mostrarCapitulo(sagaId, cap.id); })
      .catch(function () { erro("Não foi possível iniciar esta saga."); });
  }

  // ---------- Tela: capítulo ----------
  function mostrarCapitulo(sagaId, capId) {
    api("/api/saga/" + encodeURIComponent(sagaId) + "/capitulo/" + encodeURIComponent(capId))
      .then(function (cap) {
        var req = cap.requisito || {};
        var nivelMin = req.nivel || 0;
        if (nivel() < nivelMin) {
          $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
            '</h2><p class="locked">🔒 Requer nível ' + nivelMin + '. Você está no nível ' + nivel() + '.</p>' +
            '<button class="sec" id="voltar">Voltar</button></div>';
          $("voltar").onclick = telaSagas;
          return;
        }
        estado.atual[sagaId] = cap.id; salvar();

        var jaFeito = (estado.concluidos[sagaId] || []).indexOf(cap.id) !== -1;
        var rec = cap.recompensas || {};
        var recTxt = [];
        if (rec.exp) recTxt.push("+" + rec.exp + " EXP");
        if (rec.moedas) recTxt.push("+" + rec.moedas + " 🪙");

        $("tela").innerHTML = '<div class="card capitulo fade"><h2 class="titulo">' + esc(cap.titulo) +
          '</h2><p class="texto">' + esc(cap.texto) + '</p>' +
          (recTxt.length && !jaFeito ? '<div class="reward">Recompensa: ' + recTxt.join(" · ") + '</div>' : '') +
          '<button id="continuar">' + (cap.proximo ? "Continuar ➜" : "Concluir saga ✨") + '</button>' +
          '<button class="sec" id="voltar">Voltar às sagas</button></div>';

        $("voltar").onclick = telaSagas;
        $("continuar").onclick = function () {
          var lista = estado.concluidos[sagaId] || (estado.concluidos[sagaId] = []);
          if (lista.indexOf(cap.id) === -1) {
            var nivelAntes = nivel();
            lista.push(cap.id);
            estado.exp += rec.exp || 0;
            estado.moedas += rec.moedas || 0;
            salvar(); atualizarHud(); haptic("success");
            if (nivel() > nivelAntes) toast("⭐ Subiu para o nível " + nivel() + "!");
            else if (recTxt.length) toast(recTxt.join(" · "));
          }
          if (cap.proximo) {
            mostrarCapitulo(sagaId, cap.proximo);
          } else {
            delete estado.atual[sagaId]; salvar();
            $("tela").innerHTML = '<div class="card fade"><h2>🏆 Saga concluída!</h2>' +
              '<p>Você terminou esta jornada. Novos capítulos virão em breve.</p>' +
              '<button id="voltar2">Voltar às sagas</button></div>';
            $("voltar2").onclick = telaSagas;
          }
        };
      })
      .catch(function () { erro("Não foi possível carregar o capítulo."); });
  }

  carregar();
  atualizarHud();
  telaSagas();
})();
</script>
</body>
</html>
